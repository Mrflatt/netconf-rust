[package]
name = "netconf-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Lauri Huotari <65590793+Mrflatt@users.noreply.github.com>"]
description = "MCP server for NETCONF (RFC 6241) over SSH"
license = "MIT"
repository = "https://github.com/Mrflatt/netconf-rust"
homepage = "https://github.com/Mrflatt/netconf-rust"
documentation = "https://docs.rs/netconf-mcp"
categories = ["asynchronous", "network-programming"]
keywords = ["netconf", "mcp", "yang", "ssh", "async"]
readme = "README.md"
include = ["src/**/*", "tests/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[features]
default = ["stdio"]
stdio = ["rmcp/transport-io"]
http = ["rmcp/transport-streamable-http-server", "dep:axum"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio"] }
log = { version = "0.4", features = ["std"] }
netconf-async = { version = "0.1.0", path = "../netconf-async" }
quick-xml = "0.41"
rmcp = { version = "3", default-features = false, features = ["server", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "fast-rng"] }

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
