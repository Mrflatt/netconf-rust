name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update rust
        run: rustup update stable && rustup default stable
      - name: Add rustfmt
        run: rustup component add rustfmt
      - name: Run rustfmt
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update rust
        run: rustup update stable && rustup default stable
      - name: Add clippy
        run: rustup component add clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update rust
        run: rustup update stable && rustup default stable
      - name: Check netconf-async lockfile
        run: cargo update -p netconf-async --locked
      - name: Check netconf-cli lockfile
        run: cargo update -p netconf-cli --locked

  # Default builds pull tokio/io-util in transitively, so a broken feature gate
  # only shows up once someone opts out of a default feature.
  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update rust
        run: rustup update stable && rustup default stable
      - name: Check every feature combination
        run: |
          set -euo pipefail
          for features in "" "tokio" "ssh" "tokio,ssh"; do
            echo "::group::netconf-async --no-default-features --features '$features'"
            cargo check -p netconf-async --no-default-features --features "$features"
            echo "::endgroup::"
          done
          cargo check -p netconf-async --all-targets

  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install the declared MSRV
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["rust_version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="netconf-async"))')
          echo "Declared MSRV: $msrv"
          rustup toolchain install "$msrv" --no-self-update
          rustup default "$msrv"
      - name: Build netconf-async on the MSRV
        run: cargo build -p netconf-async

  test:
    if: ${{ github.actor != 'github-actions[bot]' || !contains(github.event.pull_request.title, 'release') }}
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: 1
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      CARGO_INCREMENTAL: 0
      CARGO_PUBLIC_NETWORK_TESTS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 stable
            os: ubuntu-latest
            rust: stable
            other: x86_64-unknown-linux-gnu
            features: --features vendored-openssl
          - name: Linux aarch64 stable
            os: ubuntu-latest
            rust: stable
            other: aarch64-unknown-linux-gnu
          - name: macOS x86_64 stable
            os: macos-14
            rust: stable
            other: x86_64-apple-darwin
          - name: macOS aarch64 stable
            os: macos-14
            rust: stable
            other: aarch64-apple-darwin
          - name: Windows x86_64 MSVC stable
            os: windows-latest
            rust: stable-msvc
            other: i686-pc-windows-msvc
    name: Tests ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update stable rust
        run: rustup update --no-self-update stable
      - name: Update ${{ matrix.rust }} rust
        run: rustup update --no-self-update ${{ matrix.rust }} && rustup default ${{ matrix.rust }}
      - name: Add ${{ matrix.other }} target
        run: rustup target add ${{ matrix.other }}
      - name: Install dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt update -y && sudo apt install lldb gcc-multilib libsecret-1-0 libsecret-1-dev -y
      - name: Add rustfmt
        if: matrix.os == 'ubuntu-latest'
        run: rustup component add rustfmt || echo "rustfmt not available"
      # Windows libssh2 uses WinCNG. vendored-openssl needs Strawberry Perl;
      # Git's MSYS perl is on PATH in bash and breaks OpenSSL Configure.
      # Linux x86_64 matches the release binary: --features vendored-openssl.
      - name: Run tests
        run: cargo test ${{ matrix.features }}

  release:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    needs:
      - rustfmt
      - clippy
      - lockfile
      - feature-matrix
      - msrv
      - test
    outputs:
      cli_release: ${{ steps.release.outputs['netconf-cli--release_created'] }}
      cli_tag: ${{ steps.release.outputs['netconf-cli--tag_name'] }}
      cli_version: ${{ steps.release.outputs['netconf-cli--version'] }}
    steps:
      - uses: actions/checkout@v7
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          skip-github-pull-request: true

  release-binaries:
    needs: release
    if: needs.release.outputs.cli_release == 'true'
    uses: ./.github/workflows/release-binaries.yaml
    with:
      tag: ${{ needs.release.outputs.cli_tag }}
      version: ${{ needs.release.outputs.cli_version }}
    permissions:
      contents: write
    secrets: inherit

  release-pr:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: googleapis/release-please-action@v5
        with:
          skip-github-release: true
