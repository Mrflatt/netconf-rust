[package]
name = "netconf-async"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Lauri Huotari <65590793+Mrflatt@users.noreply.github.com>"]
description = "Async NETCONF client (RFC 6241) over SSH"
license = "MIT"
repository = "https://github.com/Mrflatt/netconf-rust"
homepage = "https://github.com/Mrflatt/netconf-rust"
documentation = "https://docs.rs/netconf-async"
categories = ["asynchronous", "network-programming"]
keywords = ["netconf", "yang", "ssh", "async", "network"]
readme = "README.md"
include = ["src/**/*", "tests/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[features]
default = ["ssh"]
# NETCONF over SSH via `russh`.
ssh = ["dep:russh", "dep:zeroize", "tokio", "tokio/net"]
# Tokio-backed framer, RPC timeouts, and notification streams.
tokio = ["dep:tokio"]

[dependencies]
async-trait = "0.1"
log = { version = "0.4", features = ["std"] }
memchr = "2"
quick-xml = { version = "0.41", features = ["serialize", "overlapped-lists"] }
russh = { version = "0.63", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["serde", "std", "formatting", "parsing"] }
tokio = { version = "1", features = ["io-util", "sync", "time"], default-features = false, optional = true }
uuid = { version = "1", features = ["v4", "fast-rng"] }
zeroize = { version = "1", optional = true }

[dev-dependencies]
async-trait = "0.1"
pretty_assertions = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }

[package.metadata.docs.rs]
features = ["ssh"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
