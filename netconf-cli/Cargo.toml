[package]
name = "netconf-cli"
version = "0.1.0"
edition = "2024"
authors = ["Lauri Huotari <flatlate@gmail.com>"]
description = "Netconf cli tool written in Rust"

[dependencies]
anyhow = "1"
async-ssh2-lite = { version = "0.5", features = ["tokio"] }
clap = { version = "4", features = ["derive", "env", "cargo"] }
color-print = "0.3"
dirs = "6"
env_logger = "0.11"
futures = "0.3"
log = { version = "0.4", features = ["std"] }
netconf-async = { version = "0.1.0", path = "../netconf-async" }
ssh2 = "0.9"
ssh2-config = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
