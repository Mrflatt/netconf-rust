[package]
name = "netconf-cli"
version = "0.1.0"
edition = "2024"
authors = ["Lauri Huotari <65590793+Mrflatt@users.noreply.github.com>"]
description = "Netconf cli tool written in Rust"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "cargo"] }
color-print = "0.3"
dirs = "6"
env_logger = "0.11"
flate2 = "1"
futures = "0.3"
log = { version = "0.4", features = ["std"] }
netconf-async = { version = "0.1.0", path = "../netconf-async" }
quick-xml = { version = "0.41", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh2-config = "0.7"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }

[dev-dependencies]
wiremock = "0.6"
